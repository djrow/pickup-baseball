name: CI & Security Audit

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint static checks
        run: npm run lint

      - name: Run TypeScript JSDoc typechecks
        run: npm run typecheck

      - name: Run full verification suite
        run: npm test

      - name: Run Cloudflare workerd parity suite
        run: npm run test:workerd

      - name: Run headless browser smoke suite
        run: npm run test:browser

      - name: Run security scan (static, secret, route-guard & policy checks)
        run: npm run security:scan -- --skip-audit

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check npm dependency vulnerabilities (high/critical)
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
