name: CI & Security Audit

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Automated Tests & npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check npm dependency vulnerabilities (high/critical)
        run: npm audit --audit-level=high

      - name: Run full verification suite
        run: npm test

      - name: Run security scan (static, secret, route-guard & policy checks)
        run: npm run security:scan

  codeql:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
