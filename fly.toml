# Fly.io Configuration for Sunday Pickup Baseball Charity
# Optimized for 100% Free Tier (1 shared-cpu-1x 256MB VM + 1GB Persistent SQLite Volume)

app = "pickupbaseballfoundationapp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATA_DIR = "/app/data"
  APP_NAME = "Sunday Pickup Baseball"
  APP_URL = "https://pickupbaseballfoundationapp.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[mounts]]
  source = "baseball_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
