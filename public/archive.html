<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Games Archive | Pickup Baseball Foundation</title>
  <link rel="stylesheet" href="/css/style.css?v=24">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pickup Baseball">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container" id="main-nav">
      <div class="nav-wrap">
        <a href="/index.html" class="brand">
          <img src="/logo.svg" alt="Pickup Baseball Foundation Logo" class="brand-logo">
          <span class="brand-text"><span class="brand-line">Pickup Baseball</span> <span class="brand-line">Foundation</span></span>
          <span class="brand-short">PBF</span>
          <span class="brand-tag" data-i18n="nav.community">Community</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="margin-top: 32px; min-height: 60vh;">

    <!-- Back to Upcoming Games Link -->
    <div style="margin-bottom: 20px;">
      <a href="/index.html" class="btn btn-outline btn-sm" style="font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
        <span data-i18n="archive.back_to_upcoming">← Back to Upcoming Games</span>
      </a>
    </div>

    <!-- Archive Page Header -->
    <section class="card" style="background: var(--bg-card); border-left: 5px solid var(--secondary); margin-bottom: 28px;">
      <div style="display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap;">
        <span style="font-size: 2.2rem; line-height: 1;">📜</span>
        <div style="flex: 1; min-width: 260px;">
          <h1 style="color: var(--secondary); font-size: 1.6rem; margin-bottom: 6px;" data-i18n="archive.title">
            Past Games Archive
          </h1>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin: 0; line-height: 1.5;" data-i18n="archive.subtitle">
            Browse past Sunday games, volunteer records, attendance turnouts, and field discussions.
          </p>
        </div>
      </div>
    </section>

    <!-- Past Games Grid -->
    <section>
      <div id="archive-games-container">
        <p style="color: var(--text-muted);" data-i18n="home.loading_games">Loading past games archive...</p>
      </div>
    </section>

  </main>

  <!-- Site Footer -->
  <footer id="site-footer" class="site-footer"></footer>

  <script src="/js/api.js?v=24"></script>
  <script src="/js/archive.js?v=24"></script>
</body>
</html>
