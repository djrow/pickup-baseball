name = "pickup-baseball"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[vars]
COMMUNITY_PRESET = "pickup-baseball"
COMMUNITY_NAME = "Sunday Pickup Baseball"
PUBLIC_ORIGIN = "https://www.pickupbaseballfoundation.org"
LOCK_PREVIEW_ORIGIN = "1"
APP_NAME = "Sunday Pickup Baseball"
FROM_EMAIL = "Sunday Pickup Baseball <games@pickupbaseballfoundation.org>"
REPLY_TO_EMAIL = "pickupbaseballfoundation@gmail.com"
ADMIN_EMAIL = "pickupbaseballfoundation@gmail.com"
ADMIN_NAME = "David Rowland"
HANDBOOK_URL = "https://github.com/djrow/pickup-baseball/blob/trunk/HANDBOOK.md"

[[d1_databases]]
binding = "BASEBALL_DB"
database_name = "pickup-baseball-db"
database_id = "7a738a45-ffc0-4232-b5e0-93ed1846bf93"

[[d1_databases]]
binding = "CHAT_DB"
database_name = "pickup-chat-db"
database_id = "542da6bd-d0b6-45dd-b0c1-5884713272d7"

[[d1_databases]]
binding = "DB"
database_name = "pickup-baseball-db"
database_id = "7a738a45-ffc0-4232-b5e0-93ed1846bf93"
